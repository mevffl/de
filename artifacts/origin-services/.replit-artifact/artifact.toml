kind = "web"
previewPath = "/"
title = "Origin Services"
version = "1.0.0"
id = "artifacts/origin-services"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24435

[services.development]
run = "pnpm --filter @workspace/origin-services run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/origin-services", "run", "build" ]
publicDir = "artifacts/origin-services/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24435"
BASE_PATH = "/"
